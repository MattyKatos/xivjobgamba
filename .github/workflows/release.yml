name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download Dalamud reference assemblies
        shell: pwsh
        run: |
          $dest = Join-Path $env:APPDATA "XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile dalamud.zip
          Expand-Archive -Force dalamud.zip -DestinationPath $dest

      - name: Test
        run: dotnet test XIVJobGamba.sln -c Debug -p:Platform=x64 --nologo

      - name: Build packaged plugin
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Tag '$tag' must look like v1.2.3"
          }
          dotnet build XIVJobGamba.sln -c Release -p:Platform=x64 --nologo -p:Version=$version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Get-ChildItem -Recurse -Filter latest.zip |
            Where-Object { $_.FullName -match '[\\/]Release[\\/]' } |
            Select-Object -First 1
          if (-not $zip) { throw "DalamudPackager did not produce latest.zip" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $manifest = $archive.Entries | Where-Object {
              $_.FullName -notmatch '\.deps\.json$' -and $_.Name -like '*.json'
            }
            if (-not $manifest) { throw "Release zip is missing the plugin manifest" }
          }
          finally {
            $archive.Dispose()
          }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $zip.FullName -Destination "release\latest.zip"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag "release\latest.zip" `
            --title "XIV Job Gamba $tag" `
            --notes "Dalamud plugin package for $tag. The asset is latest.zip from DalamudPackager."
